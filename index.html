<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小室歯科・矯正歯科オンライン相談 ご予約</title>
<!-- 予約ページへ自動転送します -->
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbw4JQgcFAH5dIHf9L92dH3PWhGdvbcL78VNllN3XwzMBWmqVyw5_4rTsBzjcRWMGjSrng/exec">
<style>
  :root{ --primary:#1f6f5c; --ink:#123; --muted:#6b7a76; --bg:#eef4f1; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid #dbe7e2;border-radius:20px;max-width:400px;width:100%;
    padding:36px 28px;text-align:center;box-shadow:0 8px 30px rgba(20,60,50,.08)}
  .logo{width:56px;height:56px;border-radius:14px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
  h1{font-size:18px;font-weight:700;margin-bottom:6px}
  p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:22px}
  .spin{width:26px;height:26px;border:3px solid #dbe7e2;border-top-color:var(--primary);
    border-radius:50%;animation:sp 0.9s linear infinite;margin:0 auto 22px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .btn{display:block;width:100%;padding:15px;background:var(--primary);color:#fff;text-decoration:none;
    border-radius:12px;font-weight:700;font-size:16px}
  .btn:active{opacity:.85}
  .small{margin-top:14px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🦷</div>
    <div class="spin" id="spin"></div>
    <h1>ご予約ページへ移動しています</h1>
    <p>自動で移動しない場合は、下のボタンを押してください。</p>
    <a class="btn" id="go" href="https://script.google.com/macros/s/AKfycbw4JQgcFAH5dIHf9L92dH3PWhGdvbcL78VNllN3XwzMBWmqVyw5_4rTsBzjcRWMGjSrng/exec" target="_top" rel="noopener">予約ページを開く →</a>
    <div class="small">小室歯科・矯正歯科オンライン相談</div>
  </div>

<script>
  // 予約ページのURL
  var TARGET = 'https://script.google.com/macros/s/AKfycbw4JQgcFAH5dIHf9L92dH3PWhGdvbcL78VNllN3XwzMBWmqVyw5_4rTsBzjcRWMGjSrng/exec';
  // JavaScriptでも転送を試みる（metaリフレッシュのバックアップ）
  try {
    // 少し待ってから遷移（描画を見せてから）
    setTimeout(function(){ window.location.replace(TARGET); }, 300);
  } catch (e) {
    // 失敗時はボタンのみ（ユーザーがタップ）
    var s = document.getElementById('spin');
    if (s) s.style.display = 'none';
  }
</script>
</body>
</html>
